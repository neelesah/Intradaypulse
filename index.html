<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntradayPulse Clone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-[#0b0e11] text-white">
    <nav class="flex justify-between items-center p-4 border-b border-gray-800 bg-[#131722]">
        <div class="text-2xl font-bold text-blue-500">Intraday<span class="text-white">Pulse</span></div>
        <div class="flex gap-4 items-center">
            <span id="nifty-price" class="font-mono text-green-400">NIFTY 50: 22,450.00</span>
            <button class="bg-blue-600 px-4 py-2 rounded font-bold hover:bg-blue-500">Login</button>
        </div>
    </nav>

    <div class="grid grid-cols-1 lg:grid-cols-4 gap-2 p-2 h-[85vh]">
        <div class="lg:col-span-3 bg-[#131722] rounded-lg overflow-hidden border border-gray-800">
            <div id="tradingview_widget" class="h-full"></div>
        </div>

        <div class="bg-[#131722] border border-gray-800 rounded-lg p-4 space-y-4">
            <div class="border-b border-gray-800 pb-2">
                <h3 class="text-gray-400 text-sm uppercase">Order Panel</h3>
            </div>
            <div>
                <label class="text-xs text-gray-500">Quantity</label>
                <input type="number" value="50" class="w-full bg-black/30 border border-gray-700 p-2 mt-1 rounded outline-none focus:border-blue-500">
            </div>
            <div class="grid grid-cols-2 gap-2 mt-4">
                <button class="bg-[#00c076] py-3 rounded font-bold uppercase hover:opacity-90 active:scale-95">Buy</button>
                <button class="bg-[#ff3b3b] py-3 rounded font-bold uppercase hover:opacity-90 active:scale-95">Sell</button>
            </div>
            <div class="mt-6">
                <h4 class="text-sm text-gray-400 mb-2">Live Watchlist</h4>
                <div class="space-y-2">
                    <div class="flex justify-between text-sm bg-black/20 p-2 rounded">
                        <span>RELIANCE</span>
                        <span class="text-green-400">2,940.15</span>
                    </div>
                    <div class="flex justify-between text-sm bg-black/20 p-2 rounded">
                        <span>HDFC BANK</span>
                        <span class="text-red-400">1,422.50</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script src="script.js"></script>
</body>
      </html>
