<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntradayPulse - Unlocked Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #080a0c; color: #d1d4dc; margin: 0; overflow: hidden; }
        .bg-surface { background-color: #131722; }
        .border-base { border-color: #2a2e39; }
        .text-up { color: #089981; }
        .text-down { color: #f23645; }
        .bg-buy { background-color: #089981; }
        .bg-sell { background-color: #f23645; }
        .input-dark { background-color: #1e222d; border: 1px solid #363a45; color: white; }
        /* Hide Scrollbar */
        .no-scrollbar::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="h-screen flex flex-col">

    <header class="h-12 border-b border-base bg-surface flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-6">
            <div class="flex items-center gap-2">
                <div class="w-7 h-7 bg-blue-600 rounded flex items-center justify-center font-bold text-white text-xs">IP</div>
                <span class="font-bold text-white text-lg tracking-tighter">Intraday<span class="text-blue-500">Pulse</span></span>
            </div>
            <div class="hidden md:flex gap-5 border-l border-base pl-5">
                <div class="flex flex-col">
                    <span class="text-[9px] text-gray-500 font-bold">NIFTY 50</span>
                    <span class="text-[11px] font-mono text-up" id="nifty-val">22,512.35 (+0.52%)</span>
                </div>
                <div class="flex flex-col">
                    <span class="text-[9px] text-gray-500 font-bold">BANK NIFTY</span>
                    <span class="text-[11px] font-mono text-down">48,105.90 (-0.12%)</span>
                </div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-[11px] font-bold text-gray-400 hover:text-white cursor-pointer uppercase">Watchlist</span>
            <span class="text-[11px] font-bold text-gray-400 hover:text-white cursor-pointer uppercase">Positions</span>
            <button class="bg-blue-600 hover:bg-blue-500 text-white text-[10px] px-4 py-1.5 rounded font-bold transition">LOGIN</button>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        
        <aside class="w-12 border-r border-base bg-surface flex flex-col items-center py-4 gap-6 shrink-0">
            <div class="text-blue-500 cursor-pointer">📊</div>
            <div class="text-gray-500 hover:text-white cursor-pointer">⚡</div>
            <div class="text-gray-500 hover:text-white cursor-pointer">⚙️</div>
        </aside>

        <main class="flex-1 flex flex-col bg-black">
            <div class="h-9 border-b border-base bg-surface flex items-center px-4 gap-4 text-[10px] font-bold text-gray-400">
                <span class="text-white border-b-2 border-blue-500 h-full flex items-center px-2">NIFTY 50</span>
                <span class="hover:text-white cursor-pointer">BANKNIFTY</span>
                <span class="hover:text-white cursor-pointer">FINNIFTY</span>
            </div>
            <div id="chart_container" class="flex-1"></div>
        </main>

        <aside class="w-[320px] border-l border-base bg-surface flex flex-col shrink-0 overflow-y-auto no-scrollbar">
            <div class="flex border-b border-base text-[10px] font-black tracking-widest">
                <div class="flex-1 text-center py-3 border-b-2 border-blue-500 text-white">EXECUTION</div>
                <div class="flex-1 text-center py-3 text-gray-500 hover:text-gray-300 cursor-pointer border-l border-base">ANALYSIS</div>
            </div>

            <div class="p-4 space-y-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-sm font-bold text-white uppercase tracking-tight">Nifty 22500 CE</h2>
                        <p class="text-[9px] text-gray-500 font-bold uppercase mt-1">28 MAR EXP • Weekly</p>
                    </div>
                    <div class="text-right">
                        <div class="text-lg font-mono font-bold text-up" id="ltp">145.20</div>
                        <div class="text-[9px] text-gray-500 font-bold">LTP</div>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[9px] font-bold text-gray-500 uppercase">Qty (Lot 50)</label>
                        <input type="number" value="1" class="input-dark rounded p-2 text-xs font-bold outline-none focus:border-blue-500">
                    </div>
                    <div class="flex flex-col gap-1.5">
                        <label class="text-[9px] font-bold text-gray-500 uppercase">Price Type</label>
                        <select class="input-dark rounded p-2 text-xs font-bold outline-none cursor-pointer">
                            <option>MARKET</option>
                            <option>LIMIT</option>
                        </select>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button class="flex-1 py-1.5 text-[9px] font-black border border-blue-600 text-blue-500 rounded bg-blue-600/10">INTRADAY</button>
                    <button class="flex-1 py-1.5 text-[9px] font-black border border-base text-gray-500 rounded">OVERNIGHT</button>
                </div>

                <div class="flex flex-col gap-3 pt-4">
                    <button onclick="alert('Buy Order Placed')" class="bg-buy hover:opacity-90 py-3.5 rounded-lg text-xs font-black uppercase text-white shadow-lg active:scale-95 transition">Buy / Long Position</button>
                    <button onclick="alert('Sell Order Placed')" class="bg-sell hover:opacity-90 py-3.5 rounded-lg text-xs font-black uppercase text-white shadow-lg active:scale-95 transition">Sell / Short Position</button>
                </div>

                <div class="mt-6 p-4 bg-[#1e222d] border border-base rounded-lg">
                    <div class="flex justify-between text-[10px] font-bold mb-3 uppercase tracking-widest">
                        <span class="text-gray-500">Market Pulse</span>
                        <span class="text-up">72% Buy Strength</span>
                    </div>
                    <div class="h-1.5 w-full bg-gray-800 rounded-full flex overflow-hidden">
                        <div class="bg-buy h-full" style="width: 72%"></div>
                        <div class="bg-sell h-full" style="width: 28%"></div>
                    </div>
                </div>
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // 1. Exact TradingView Setup as IntradayPulse
        new TradingView.widget({
            "autosize": true,
            "symbol": "NSE:NIFTY",
            "interval": "1",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "backgroundColor": "#080a0c",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "chart_container"
        });

        // 2. Mock Live Price Tickers
        function updatePrices() {
            const ltp = document.getElementById('ltp');
            let base = 145.20;
            setInterval(() => {
                let change = (Math.random() * 0.4 - 0.2).toFixed(2);
                base = (parseFloat(base) + parseFloat(change)).toFixed(2);
                ltp.innerText = base;
                ltp.className = change >= 0 ? "text-lg font-mono font-bold text-up" : "text-lg font-mono font-bold text-down";
            }, 1000);
        }
        updatePrices();
    </script>
</body>
  </html>
