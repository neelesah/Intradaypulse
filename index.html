<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IntradayPulse Pro Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #08090b; color: #e1e1e1; margin: 0; overflow: hidden; }
        .sidebar { background-color: #131722; border-left: 1px solid #2a2e39; }
        .header { background-color: #131722; border-bottom: 1px solid #2a2e39; }
        .btn-buy { background-color: #089981; transition: 0.2s; }
        .btn-buy:hover { background-color: #06806c; }
        .btn-sell { background-color: #f23645; transition: 0.2s; }
        .btn-sell:hover { background-color: #d12d39; }
        .input-box { background-color: #1e222d; border: 1px solid #363a45; color: white; }
        .active-tab { border-bottom: 2px solid #2962ff; color: #2962ff; }
    </style>
</head>
<body class="flex flex-col h-screen">

    <header class="header h-14 flex items-center justify-between px-4 shrink-0">
        <div class="flex items-center gap-6">
            <div class="text-blue-500 font-bold text-xl tracking-tight uppercase">Intraday<span class="text-white">Pulse</span></div>
            <div class="hidden md:flex gap-4 text-xs font-semibold">
                <div class="flex flex-col"><span class="text-gray-500">NIFTY 50</span><span class="text-green-400" id="nifty-top">22,450.75 (+0.45%)</span></div>
                <div class="flex flex-col"><span class="text-gray-500">BANK NIFTY</span><span class="text-red-400">47,820.10 (-0.12%)</span></div>
            </div>
        </div>
        <div class="flex items-center gap-4">
            <button class="bg-[#2962ff] text-white text-xs px-4 py-2 rounded font-bold uppercase">Connect Broker</button>
            <div class="w-8 h-8 rounded-full bg-gray-700"></div>
        </div>
    </header>

    <div class="flex flex-1 overflow-hidden">
        <main class="flex-1 flex flex-col bg-[#131722]">
            <div class="h-10 border-b border-[#2a2e39] flex items-center px-4 gap-6 text-xs text-gray-400">
                <span class="active-tab h-full flex items-center px-2 cursor-pointer font-bold uppercase">Nifty 50</span>
                <span class="hover:text-white cursor-pointer uppercase">Bank Nifty</span>
                <span class="hover:text-white cursor-pointer uppercase">Fin Nifty</span>
            </div>
            <div class="flex-1 relative">
                <div id="tv_chart" class="absolute inset-0"></div>
            </div>
        </main>

        <aside class="sidebar w-80 shrink-0 flex flex-col">
            <div class="p-4 flex flex-col gap-6">
                <div class="flex justify-between items-start">
                    <div>
                        <h2 class="text-lg font-bold">NIFTY 22450 CE</h2>
                        <p class="text-xs text-gray-500">28 MAR EXPIRY</p>
                    </div>
                    <div class="text-right">
                        <div class="text-xl font-bold text-green-400" id="live-price">142.55</div>
                        <div class="text-[10px] text-gray-500">+4.20 (3.12%)</div>
                    </div>
                </div>

                <div class="flex border-b border-[#2a2e39] text-xs font-bold text-gray-500">
                    <div class="flex-1 text-center pb-2 active-tab">REGULAR</div>
                    <div class="flex-1 text-center pb-2">STRATEGY</div>
                </div>

                <div class="space-y-4">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Quantity (Lot Size 50)</label>
                        <input type="number" value="50" class="input-box p-3 rounded outline-none text-sm font-bold">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] text-gray-500 uppercase font-bold">Price</label>
                        <div class="flex gap-2">
                            <input type="text" value="Market" disabled class="input-box p-3 rounded outline-none text-sm font-bold flex-1 opacity-50">
                            <button class="bg-[#363a45] px-4 rounded text-[10px] font-bold">LIMIT</button>
                        </div>
                    </div>
                </div>

                <div class="flex gap-2 pt-4">
                    <button class="btn-buy flex-1 py-4 rounded text-white font-black uppercase text-sm shadow-lg shadow-green-900/20">Buy</button>
                    <button class="btn-sell flex-1 py-4 rounded text-white font-black uppercase text-sm shadow-lg shadow-red-900/20">Sell</button>
                </div>
            </div>

            <div class="mt-auto border-t border-[#2a2e39] p-4 bg-[#0d1017]">
                <h3 class="text-[10px] font-bold text-gray-500 uppercase mb-3">Market Pulse</h3>
                <div class="flex justify-between text-[11px] mb-2">
                    <span class="text-green-500">Bid 142.50 (5,200)</span>
                    <span class="text-red-500">(3,850) Ask 142.60</span>
                </div>
                <div class="w-full h-1 bg-gray-800 rounded-full flex overflow-hidden">
                    <div class="bg-green-600 h-full" style="width: 65%"></div>
                    <div class="bg-red-600 h-full" style="width: 35%"></div>
                </div>
            </div>
        </aside>
    </div>

    <script type="text/javascript" src="https://s3.tradingview.com/tv.js"></script>
    <script>
        // TradingView Chart
        new TradingView.widget({
            "autosize": true,
            "symbol": "NSE:NIFTY",
            "interval": "1",
            "timezone": "Asia/Kolkata",
            "theme": "dark",
            "style": "1",
            "locale": "en",
            "toolbar_bg": "#131722",
            "enable_publishing": false,
            "hide_side_toolbar": false,
            "allow_symbol_change": true,
            "container_id": "tv_chart"
        });

        // Price Tick Simulation
        function tick() {
            const priceEl = document.getElementById('live-price');
            const topPrice = document.getElementById('nifty-top');
            let current = 142.55;
            
            setInterval(() => {
                let change = (Math.random() * 0.4 - 0.2).toFixed(2);
                current = (parseFloat(current) + parseFloat(change)).toFixed(2);
                priceEl.innerText = current;
                priceEl.style.color = change >= 0 ? '#00c076' : '#ff3b3b';
                
                setTimeout(() => priceEl.style.color = '', 300);
            }, 1000);
        }
        tick();
    </script>
</body>
  </html>
