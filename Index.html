<!DOCTYPE html>
<html>
<head>
    <title>IntradayPulse - AI TradeX Scanner</title>
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    <style>
        :root { --bg: #0d1117; --side: #010409; --card: #161b22; --border: #30363d; --blue: #58a6ff; }
        body { background: var(--bg); color: #c9d1d9; font-family: sans-serif; margin: 0; display: flex; height: 100vh; }
        .sidebar { width: 220px; background: var(--side); border-right: 1px solid var(--border); padding: 20px; }
        .logo { font-size: 22px; font-weight: bold; color: white; margin-bottom: 25px; }
        .logo span { color: var(--blue); }
        .nav-item { padding: 12px; color: #8b949e; cursor: pointer; border-radius: 6px; margin-bottom: 5px; font-size: 14px; }
        .nav-item.active { background: #1f242c; color: white; border-left: 3px solid var(--blue); }
        .main { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
        .header { padding: 15px 25px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; background: var(--side); }
        .grid-container { padding: 20px; overflow-y: auto; flex: 1; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 15px; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 18px; position: relative; }
        .bramhand-tag { background: #ff9800; color: black; font-weight: 900; font-size: 10px; padding: 2px 8px; border-radius: 4px; position: absolute; top: 15px; right: 15px; box-shadow: 0 0 10px orange; }
        .buy { color: #3fb950; } .sell { color: #f85149; }
        .price { font-size: 28px; font-weight: bold; margin: 15px 0; color: white; }
    </style>
</head>
<body>
    <div class="sidebar">
        <div class="logo">INTRADAY<span>PULSE</span></div>
        <div class="nav-item active">TradeX AI Scanner</div>
        <div class="nav-item">Bramhand Alerts</div>
        <div class="nav-item">Sector Heatmap</div>
    </div>
    <div class="main">
        <div class="header">
            <div style="font-weight: bold;">TRADEX <span style="color:var(--blue)">LIVE ENGINE</span></div>
            <div id="clock" style="color: #8b949e;"></div>
        </div>
        <div class="grid-container"><div class="grid" id="board"></div></div>
    </div>
    <audio id="beep" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg"></audio>
    <script>
        const socket = io();
        const beep = document.getElementById('beep');
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        socket.on('trade_signal', function(data) {
            let card = document.getElementById(data.symbol) || document.createElement('div');
            card.id = data.symbol; card.className = 'card';
            if (data.isBramhand) beep.play().catch(e => {});
            card.innerHTML = `
                ${data.isBramhand ? '<div class="bramhand-tag">BRAMHAND</div>' : ''}
                <div style="font-weight:bold; font-size:16px;">${data.symbol} <span class="${data.type.toLowerCase()}">${data.type}</span></div>
                <div class="price">₹${data.price}</div>
                <div style="font-size:12px; color:gray; border-top:1px solid #21262d; padding-top:10px;">
                    Acc: <b style="color:white">${data.accuracy}</b> | Vol: <b style="color:white">${data.volume}</b>
                </div>
            `;
            document.getElementById('board').prepend(card);
        });
    </script>
</body>
</html>
